<div class="container">
        <div class="row">
            <div class="col-md-12">
                <a routerLink="/add-employee">
                    <i class="bi bi-person-plus-fill me-2"></i><span>Add Employee</span>
                </a>
            </div>
        </div>
    <div class="row">
        <div class="col-md-12">
            <div class="table-responsive" *ngIf="empList.length>0">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Emp Code</th>
                            <th>Name</th>
                            <th>DOB</th>                            
                            <th>Gender</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let emp of empList; let i=index;">
                            <td>{{i+1}}</td>
                            <td>{{emp.empCode}}</td>
                            <td>{{emp.employeeName}}</td>
                            <td>{{emp.dob | date:'dd-MM-yyyy'}}</td>                            
                            <td>{{emp.gender}}</td>
                            <td class="text-center">
                                <a routerLink="/emp-edit/{{emp.employeeId}}" class="text-info me-2">
                                <i class="bi bi-pencil-square"></i>
                                </a>
                                <a routerLink="/add-employee" class="text-primary me-2">
                                    <i class="bi bi-eye-fill"></i>
                                </a>
                                <button class="btn btn-danger" (click)="openDelete(emp.employeeId)">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </td>   
                        </tr>
                    </tbody>
                </table>
            </div>            
        </div>
    </div>
</div>
<app-modal-component
[title]="'Delete Employee'"
[isOpen]="isModelOpen"
(close)="isModelOpen=false"
(confirm)="deleteEmployee()">        
<p>Are you sure you want to delete this employee?</p>
</app-modal-component>
