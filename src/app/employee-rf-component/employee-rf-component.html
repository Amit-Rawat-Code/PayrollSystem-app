<div class="container">
    <div class="row">        
        <div class="col-md-6"><a routerLink="/emp-list" class="text-info"><i class="bi bi-arrow-left-circle-fill me-2"></i><span>Go to list</span></a></div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <form [formGroup]="employeeFormGroup" (ngSubmit)="Save()" >
                <div class="form-group mb-2">
                    <label for="employeeName">Employee Name</label>
                    <input type="text" name="employeeName" [class.is-invalid]="f['employeeName'].invalid && f['employeeName'].touched" class="form-control" formControlName="employeeName" id="employeeName">
                </div>
                <div class="alert alert-danger" *ngIf="f['employeeName'].invalid && f['employeeName'].touched">
                    <div *ngIf="f['employeeName'].errors && f['employeeName'].errors['required']">
                        Name is required
                    </div>
                    <div *ngIf="f['employeeName'].errors && f['employeeName'].errors['minlength']">
                        Minimum 3 character
                    </div>
                    <div *ngIf="f['employeeName'].errors && f['employeeName'].errors['maxlength']">
                        Maximum 20 character
                    </div>
                </div>
                <div class="form-group mb-2">
                    <label for="empCode">Employee Code</label>
                    <input type="text" name="empCode" [class.is-invalid]="f['empCode'].invalid && f['empCode'].touched" class="form-control" formControlName="empCode" id="empCode">
                </div>
                <div class="alert alert-danger" *ngIf="f['empCode'].invalid && f['empCode'].touched">
                    <div *ngIf="f['empCode'].errors && f['empCode'].errors['required']">
                        Employee Code is required
                    </div>
                </div>
                <div class="form-group mb-2">
                    <label for="mobile">Mobile</label>
                    <input type="text" name="mobile" [class.is-invalid]="f['mobile'].invalid && f['mobile'].touched" class="form-control" formControlName="mobile" id="mobile">
                </div>
                <div class="alert alert-danger" *ngIf="f['mobile'].invalid && f['mobile'].touched">
                    <div *ngIf="f['mobile'].errors && f['mobile'].errors['required']">
                        Mobile is required
                    </div>
                </div>
                <label>Gender</label>
                <div class="form-check">
                    <input type="radio" name="gender" value="Male" class="form-check-input" formControlName="gender" id="gender1">
                    <label for="gender1">Male</label>
                </div>
                <div class="form-check mb-2">
                    <input type="radio" name="gender" value="Female" class="form-check-input" formControlName="gender" id="gender2">
                    <label for="gender2">Female</label>
                </div>
                <div class="form-group mb-2">
                    <label for="dob">Dob</label>
                    <input type="date" name="dob" id="dob" [class.is-invalid]="f['dob'].invalid && f['dob'].touched" formControlName="dob" class="form-control">
                </div>
                <div class="alert alert-danger" *ngIf="f['dob'].invalid && f['dob'].touched">
                    <div *ngIf="f['dob'].errors && f['dob'].errors['required']">
                        Dob is required
                    </div>
                </div>
                <label for="address">Address</label>
                <div class="form-group mb-2">
                    <textarea name="address" id="address" [class.is-invalid]="f['address'].invalid && f['address'].touched" formControlName="address" class="form-control"></textarea>
                </div>
                <div class="alert alert-danger" *ngIf="f['address'].invalid && f['address'].touched">
                    <div *ngIf="f['address'].errors && f['address'].errors['required']">
                        Address is required
                    </div>
                </div>
                <label for="fileImage">Image</label>
                <div class="form-group mb-2">
                    <input type="file" name="fileImage" id="fileImage" (change)="onFileSelected($event)">
                </div>
                <div *ngIf="previewUrl">
                    <img [src]="previewUrl" width="150px" alt="">
                </div>
                <div class="form-check">
                    <input type="checkbox" name="isManager" id="isManager" formControlName="isManager" class="form-check-input">
                    <label for="isManager">Check if Manager</label>
                </div>
                <div class="d-grid">
                    <button type="submit" [class.disabled]="employeeFormGroup.invalid" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
