<div class="container">
    <form [formGroup]="empBankDetailForm" (ngSubmit)="Save()">
        <div class="row mb-2">
            <div class="col-md-3">
                <div class="form-group">
                    <label for="EmployeeId">Employee</label>
                    <select formControlName="EmployeeId" id="EmployeeId" class="form-control"
                        [class.is-invalid]="f['EmployeeId'].touched && f['EmployeeId'].invalid">
                        <option value="0">SELECT</option>
                        <option *ngFor="let emp of employeeList;" [value]="emp.employeeId">{{emp.employeeName}}</option>
                    </select>
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label for="BankName">Bank Name</label>
                    <input type="text" formControlName="BankName" id="BankName" class="form-control"
                        [class.is-invalid]="f['BankName'].touched && f['BankName'].invalid">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label for="AccountNo">Account No</label>
                    <input type="text" formControlName="AccountNo" id="AccountNo" class="form-control"
                        [class.is-invalid]="f['AccountNo'].touched && f['AccountNo'].invalid">
                </div>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col-md-3">
                <div class="form-group">
                    <label for="IFSC">IFSC</label>
                    <input type="text" formControlName="IFSC" id="IFSC" class="form-control"
                        [class.is-invalid]="f['IFSC'].touched && f['IFSC'].invalid">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label for="PAN">PAN</label>
                    <input type="text" formControlName="PAN" id="PAN" class="form-control"
                        [class.is-invalid]="f['PAN'].touched && f['PAN'].invalid">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label for="Aadhaar">Aadhaar</label>
                    <input type="text" formControlName="Aadhaar" id="Aadhaar" class="form-control"
                        [class.is-invalid]="f['Aadhaar'].touched && f['Aadhaar'].invalid">
                </div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="form-group">
                    <label for="PaymentMode">Payment Mode</label>
                    <select formControlName="PaymentMode" id="PaymentMode" class="form-control"
                        [class.is-invalid]="f['PaymentMode'].touched && f['PaymentMode'].invalid">
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                    </select>
                </div>
            </div>
            <div class="col-md-3">
                <label for="IsActive">Status</label>
                <div class="form-check">                
                    <input type="checkbox" formControlName="IsActive" id="IsActive" class="form-check-input">
                    <label for="IsActive">Active</label>
                </div>
            </div>
        </div>
        <div class="row mb-5">
            <div class="col-md-3 d-grid">
                <button type="submit" [disabled]="empBankDetailForm.invalid || empBankDetailForm.value.BankId!=0" class="btn btn-success">Save</button>
            </div>
            <div class="col-md-3 d-grid">
                <button type="submit" [disabled]="empBankDetailForm.value.BankId==0" class="btn btn-info">Update</button>
            </div>
            <div class="col-md-3 d-grid">
                <button type="button" [disabled]="empBankDetailForm.value.BankId==0" class="btn btn-danger" (click)="openDelete()">Delete</button>
            </div>
            <div class="col-md-3 d-grid">
                <button type="button" [disabled]="!empBankDetailForm.dirty" class="btn btn-warning" (click)="resetForm()">Clear</button>
            </div>
        </div>
    </form>
    <div class="row">
        <div class="col-md-12">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Employee Name</th>
                        <th>Bank Name</th>
                        <th>Aadhaar</th>
                        <th>Payment Mode</th>
                        <th>Status</th>
                        <th>Created On</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let bnkDetail of empBankDetailList;let i=index;">
                        <td>{{i+1}}</td>
                        <td>{{bnkDetail.EmployeeName}}</td>
                        <td>{{bnkDetail.BankName}}</td>
                        <td>{{bnkDetail.Aadhaar}}</td>
                        <td>{{bnkDetail.PaymentMode}}</td>
                        <td>{{bnkDetail.IsActive?'Active':'InActive'}}</td>
                        <td>{{bnkDetail.CreatedOn | date:'dd-MM-yyyy HH:MM:SS'}}</td>
                        <td class="text-center">
                            <button class="btn btn-info" (click)="editEmployeeBankDetail(bnkDetail)">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<app-modal-component
[title]="modalConfig.title"
[isOpen]="modalConfig.isModalOpen"
[type]="modalConfig.type"
[message]="modalConfig.message"
(close)="handleClose()"
(confirm)="handleConfirm()">
</app-modal-component>
