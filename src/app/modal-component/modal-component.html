<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-box">

    <div class="modal-header" [ngClass]="{'success':type === 'success','error':type === 'error','confirm':type === 'confirm'}">
      <h5>{{ title }}</h5>
      <button class="btn-close" (click)="onClose()"></button>
    </div>

    <div class="modal-body">
      <p>{{message}}</p>
      <ng-content></ng-content>
    </div>

    <div class="modal-footer">
      <button 
        *ngIf="type === 'success' || type === 'error'"
        class="btn btn-primary"
        (click)="onClose()">
        OK
      </button>
      <ng-container *ngIf="type === 'confirm'">
        <button class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button class="btn btn-danger" (click)="onConfirm()">Confirm</button>
      </ng-container>
    </div>

  </div>
</div>
